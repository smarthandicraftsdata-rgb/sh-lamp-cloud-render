services:
  - type: web
    name: sh-lamp-cloud-render
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sh-lamp-postgres
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: CORS_ORIGINS
        value: "*"
      - key: COMMAND_TTL_SECONDS
        value: "120"
      - key: SHADOW_AUTH_ENABLED
        value: "false"
      - key: DEVICE_CREDENTIAL_WRAPPING_KEY_VERSION
        value: "1"

databases:
  - name: sh-lamp-postgres
    plan: free
    region: singapore
    databaseName: shlamp
    user: shlamp
